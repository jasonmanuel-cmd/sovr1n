<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovr1n Beta Testing Sign-Up</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #0066cc;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
        }
        input[type="checkbox"],
        input[type="radio"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checkbox-item label {
            margin-bottom: 0;
            cursor: pointer;
            font-weight: normal;
        }
        .help-text {
            font-size: 13px;
            color: #999;
            margin-top: 4px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0052a3;
        }
        button:active {
            transform: scale(0.99);
        }
        .success {
            display: none;
            background: #e8f5e9;
            border: 2px solid #4caf50;
            color: #2e7d32;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .error {
            display: none;
            background: #ffebee;
            border: 2px solid #f44336;
            color: #c62828;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Sovr1n Beta Testing</h1>
            <p>Help shape the future of delivery logistics</p>
        </div>

        <div class="success" id="success">
            ✅ Thank you! We'll contact you soon to get started.
        </div>
        <div class="error" id="error">
            ❌ Something went wrong. Please try again.
        </div>

        <form id="betaForm">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required>
                <div class="help-text">First and last name</div>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
                <div class="help-text">We'll use this to contact you</div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number (Optional)</label>
                <input type="text" id="phone" name="phone" placeholder="(555) 123-4567">
            </div>

            <div class="form-group">
                <label>What's your role? *</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="radio" id="customer" name="role" value="customer" required>
                        <label for="customer">Customer (Need delivery for items)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="radio" id="driver" name="role" value="driver">
                        <label for="driver">Driver (Want to earn from deliveries)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="radio" id="shopowner" name="role" value="shop-owner">
                        <label for="shopowner">Shop Owner (Sell items & arrange delivery)</label>
                    </div>
                </div>
                <div class="help-text">Select the role that best describes you</div>
            </div>

            <div class="form-group">
                <label for="experience">Have you used similar platforms before? *</label>
                <select id="experience" name="experience" required>
                    <option value="">-- Select --</option>
                    <option value="no">No, this would be new for me</option>
                    <option value="uber-freight">Yes, Uber Freight or similar</option>
                    <option value="gig">Yes, gig economy platforms (DoorDash, Uber, etc.)</option>
                    <option value="other">Yes, other platforms</option>
                </select>
            </div>

            <div class="form-group">
                <label for="problem">What problem are you trying to solve? *</label>
                <textarea id="problem" name="problem" rows="3" placeholder="E.g., I need affordable local delivery, I want to earn extra income, I need to expand my shop's reach..." required></textarea>
                <div class="help-text">Help us understand your needs</div>
            </div>

            <div class="form-group">
                <label for="frequency">How often would you use Sovr1n? *</label>
                <select id="frequency" name="frequency" required>
                    <option value="">-- Select --</option>
                    <option value="daily">Daily or multiple times per week</option>
                    <option value="weekly">Once or twice per week</option>
                    <option value="monthly">Few times per month</option>
                    <option value="occasional">Occasionally, as needed</option>
                </select>
            </div>

            <div class="form-group">
                <label>Geographic Area (Bakersfield/Kern County)</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="bakersfield" name="area" value="bakersfield">
                        <label for="bakersfield">Bakersfield</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="shafter" name="area" value="shafter">
                        <label for="shafter">Shafter</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="lamont" name="area" value="lamont">
                        <label for="lamont">Lamont</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="oildale" name="area" value="oildale">
                        <label for="oildale">Oildale</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="other-area" name="area" value="other">
                        <label for="other-area">Other (within 30 miles)</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree">I agree to participate in beta testing and provide feedback</label>
                </div>
            </div>

            <button type="submit">Join the Beta Program</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('betaForm');
        const successMsg = document.getElementById('success');
        const errorMsg = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                role: formData.get('role'),
                experience: formData.get('experience'),
                problem: formData.get('problem'),
                frequency: formData.get('frequency'),
                areas: formData.getAll('area'),
                timestamp: new Date().toISOString()
            };

            try {
                const response = await fetch('https://sovr1n.com/api/beta/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    successMsg.style.display = 'block';
                    errorMsg.style.display = 'none';
                    form.style.display = 'none';
                } else {
                    errorMsg.textContent = '❌ ' + (result.error || 'Something went wrong');
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = '❌ ' + err.message;
                errorMsg.style.display = 'block';
                console.error('Error:', err);
            }
        });
    </script>
</body>
</html>
